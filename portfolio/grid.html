<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

                 <style>
                    .container {
                        display: flex;
                        flex-direction: column;
                    }
            
                    .header {
                        display: flex;
                        background-color: red;
                        justify-content: center;
                        align-items: center;
                        height: 214px;
                    }
            
                    .introduction {
                        display: flex;
                    }
            
                    .profile {
                        display: flex;
                        background-color: blue;
                        flex: 0.25;
                        height: 439px;
                        justify-content: center;
                        align-items: center;
                    }
            
                    .intro {
                        background-color: gray;
                        flex: 1;
                        height: 439px;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                    }
            
                    .main {
                        background-color: green;
                        flex: 1;
                        height: 308px;
                        display: flex;
                        
                        
                    }
            
                    .logo {
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        background-color: purple;
                        flex: 0.25;
                        height: 308px;
                    }
            
                    
                    .content {
                        background-color: brown;
                        flex: 1;
                        justify-content: center;
                        align-items: center;
                        display: flex;
                    }
            
                    .footer {
                        display: flex;
                        background-color: orange;
                        justify-content: center;
                        align-items: center;
                        height: 120px;
                        gap: 12px;
                    }
            
                    .social-media {
                        border-radius: 50%;
                        border: 1px solid black;
                        width: 36px;
                        height: 36px;
                    }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="introduction">
            <div class="profile">profile</div>
            <div class="intro">intro</div>
        </div>
        <div class="main">
            <div class="logo">Logo</div>
            <div class="content">Main Content</div>
        </div>
    </div>
    <div class="footer">
        <div class="social-media">twitter/x</div>
        <div class="social-media">github</div>
        <div class="social-media">linkedin</div>
    </div>
</div>
    </div>
</body>
</html>
