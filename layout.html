<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <!--style information-->
    <style>
        
        .navbar {
        
            background-color: #4CB4C4;
            height: 84px;
            margin: 2px;

        }
        .home {
            display: flex;
            background-color: #dad4d4;
           
        }
        .about {
            display: flex;
            background-color: #dad4d4;
            
        }
        .portfolio {
            display: flex;
            background-color: #dad4d4;
            
        }
        .contact {
            display: flex;
            background-color: #dad4d4;
            
        }
        .portfolio-header {
            display: flex;
            background-color:rgb(140, 223, 174);
            height: 55px;
            align-items: left;
        }

        h1 {
            font-size: 20px;
        }

        .portfolio-section {
            display: flex;
            background-color:rgb(140, 223, 174);
            padding: 20px;
            justify-content: space-around;
        }
        
        .portfolio-description {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
            
        }
        .portfolio-image {
            display: flex;
            background-color: #dad4d4;
            padding: 30px;
            border-radius: 50%;
                        border: 1px solid black;
                        width: 100px;
                        height: 100px;
            justify-content: center;
            align-items: center;
        }

        .project-one {
            display: flex;
            background-color: #4CB4C4;
            justify-content: space-around;
            align-items: center;
            height: 300px;
        }

        .project-description {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
        }

        .project-image {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
        }
        
    </style>
</head>


<body>
    <div class="container">
        <div class="row navbar">
            <div class="home col-3">Home</div>
            <div class="about col-3">About</div>
            <div class="portfolio col-3">Portfolio</div>
            <div class="contact col-3">Contact</div>
                </div>
        
                <div class="portfolio-header">
                    <h1>Welcome to my porfolio!</h1>
                    </div>
        
                
                    <div class="portfolio-section">
                        <div class="portfolio-description">Description</div>
                        <div class="portfolio-image">
                            <span>Portfolio image</span>
                        </div>
                    </div>
                            
        

      
            <div class="project-one">
                <div class="project-image">Project 1 image</div>
                <div class="project-description">Project 1 description</div> 
                    </div>

              


   
</body>
</html>
