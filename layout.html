<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--style information-->
    <style>
        .container {
            display: flex;
            flex-direction: column;
        }
        .navbar {
            display: flex;
            background-color: #4CB4C4;
            justify-content: space-around;
            align-items: center;
            height: 84px;

        }
        .home {
            display: flex;
            background-color: #dad4d4;
           
        }
        .about {
            display: flex;
            background-color: #dad4d4;
            
        }
        .portfolio {
            display: flex;
            background-color: #dad4d4;
            
        }
        .contact {
            display: flex;
            background-color: #dad4d4;
            
        }
        .portfolio-header {
            display: flex;
            background-color:rgb(140, 223, 174);
            height: 55px;
            align-items: left;
        }

        h1 {
            font-size: 20px;
        }

        .portfolio-section {
            display: flex;
            background-color:rgb(140, 223, 174);
            padding: 20px;
            justify-content: space-around;
        }
        
        .portfolio-description {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
            
        }
        .portfolio-image {
            display: flex;
            background-color: #dad4d4;
            padding: 30px;
            border-radius: 50%;
                        border: 1px solid black;
                        width: 36px;
                        height: 36px;
        }

        .project-one {
            display: flex;
            background-color: #4CB4C4;
            justify-content: space-around;
            align-items: center;
            height: 300px;
        }

        .project-description {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
        }

        .project-image {
            display: flex;
            background-color: #dad4d4;
            padding: 20px;
        }
        
    </style>
</head>


<body>
    <div class="container">
        <div class="navbar">
            <div class="home">Home</div>
            <div class="about">About</div>
            <div class="portfolio">Portfolio</div>
            <div class="contact">Contact</div>
                </div>
        
                <div class="portfolio-header">
                    <h1>Welcome to my porfolio!</h1>
                    </div>
        
                
                    <div class="portfolio-section">
                        <div class="portfolio-description">Description</div>
                        <div class="portfolio-image">Portfolio image</div>
                            </div>
        

      
            <div class="project-one">
                <div class="project-image">Project 1 image</div>
                <div class="project-description">Project 1 description</div> 
                    </div>

              


   
</body>
</html>
